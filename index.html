function buildBonusBackground(){
  const CW = L.cols*TILE, CH = cv.height;
  const c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const gr = g.createLinearGradient(0,0,0,MT+TILE); gr.addColorStop(0,'#0c1a3a'); gr.addColorStop(1,'#1d4a5a'); g.fillStyle = gr; g.fillRect(0,0,CW,MT+TILE);
  for(let i=0;i<3;i++){ g.globalAlpha = 0.25; g.fillStyle = ['#58e08a','#7ad8ff','#b07aff'][i]; g.beginPath(); g.moveTo(0,4+i*5); for(let x=0;x<=CW;x+=20) g.lineTo(x, 8+i*5+Math.sin(x/38+i)*5); g.lineTo(CW,0); g.lineTo(0,0); g.closePath(); g.fill(); }
  g.globalAlpha = 1; const r = mulberry32(31); for(let i=0;i<40;i++){ g.fillStyle = '#fff'; g.fillRect((r()*CW)|0,(r()*(MT+8))|0,2,2); }
  // neve lisa, como no quintal anterior (sem bordas de ladrilho)
  const rs = mulberry32(33);
  for(let y=0;y<L.rows;y++) for(let x=0;x<L.cols;x++){
    const ox = x*TILE, oy = y*TILE+MT;
    g.fillStyle = (x+y)&1 ? '#eef4ff' : '#e3ecfa'; g.fillRect(ox,oy,TILE,TILE);
    for(let i=0;i<3;i++){ g.fillStyle = '#ffffff'; g.fillRect(ox+((rs()*34)|0), oy+((rs()*36)|0), 3, 2); }
    g.fillStyle = '#cdd9ee'; g.fillRect(ox+((rs()*30)|0), oy+((rs()*34)|0), 4, 1);
  }
  // caminhos de pedra: uma rua no meio e uma alameda até a oficina
  const pathTile = (x,y) => { const ox = x*TILE, oy = y*TILE+MT;
    g.fillStyle = (x+y)&1 ? '#d8c9aa' : '#cfbf9e'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#e8dcc2'; g.fillRect(ox+3,oy+3,12,7); g.fillRect(ox+22,oy+20,12,8); g.fillStyle = '#b8a888'; g.fillRect(ox,oy+TILE-1,TILE,1); };
  for(let x=1;x<L.cols-1;x++) pathTile(x,5);
  for(let y=1;y<5;y++) pathTile(13,y);
  // borda de pinheiros em todo o contorno livre
  const used = new Set(L.machines.filter(m => m.kind!=='table').map(m => m.x+','+m.y));
  for(let x=11;x<=15;x++) used.add(x+',0');
  [['CORPOS',2,0],['CABELOS',0,1],['CHAPÉUS',0,5],['SAPATOS',L.cols-1,1],['TINTAS',3,L.rows-1]].forEach(s => used.add(s[1]+','+s[2]));
  const decorCells = [['lamp',6,0],['snowman',8,0],['lamp',10,0],['gift',1,0],['gift',0,4],['snowman',0,9],['lamp',L.cols-1,5],['gift',L.cols-1,7],['gift',9,L.rows-1],['lamp',12,L.rows-1],['snowman',14,L.rows-1],['gift',2,L.rows-1]];
  decorCells.forEach(d => used.add(d[1]+','+d[2]));
  const wk0 = W.kind; W.kind = 'polo';
  for(let x=0;x<L.cols;x++) for(const y of [0,L.rows-1]) if(!used.has(x+','+y)) drawPine(g,x,y,false);
  for(let y=1;y<L.rows-1;y++) for(const x of [0,L.cols-1]) if(!used.has(x+','+y)) drawPine(g,x,y,false);
  W.kind = wk0;
  // oficina (porta em x=13)
  const wx = 11*TILE, wy = MT;
  g.fillStyle = '#8a5a2a'; g.fillRect(wx,wy,5*TILE,TILE);
  for(let i=0;i<5;i++){ g.fillStyle = i&1 ? '#7a4c22' : '#96622e'; g.fillRect(wx,wy+i*8,5*TILE,7); g.fillStyle = '#5a3818'; g.fillRect(wx,wy+i*8+7,5*TILE,1); }
  [[11,'#ffd86a'],[15,'#ffd86a']].forEach(w => { g.fillStyle = '#0b0e1f'; g.fillRect(w[0]*TILE+7,wy+9,26,22); g.fillStyle = w[1]; g.fillRect(w[0]*TILE+9,wy+11,22,18); g.fillStyle = '#6a4228'; g.fillRect(w[0]*TILE+19,wy+11,2,18); g.fillRect(w[0]*TILE+9,wy+19,22,2); });
  g.fillStyle = '#0b0e1f'; g.fillRect(13*TILE+5,wy+6,30,34); g.fillStyle = '#c8323c'; g.fillRect(13*TILE+7,wy+8,26,32); g.fillStyle = '#e8504a'; g.fillRect(13*TILE+7,wy+8,26,3); g.fillStyle = '#ffd34d'; g.fillRect(13*TILE+27,wy+26,3,3);
  g.strokeStyle = '#0b0e1f'; g.lineWidth = 2; g.strokeRect(wx+1,wy+1,5*TILE-2,TILE-2);
  g.fillStyle = '#eef4ff'; g.fillRect(wx-6,wy-14,5*TILE+12,6); g.fillStyle = '#b0282e'; g.fillRect(wx-6,wy-8,5*TILE+12,14); g.fillStyle = '#7a1a1e'; g.fillRect(wx-6,wy+4,5*TILE+12,3);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 11px "Trebuchet MS", Verdana, sans-serif'; g.fillStyle = '#fff3c8'; g.fillText('OFICINA', 13*TILE+20, wy-1);
  // enfeites do quintal
  const wk = W.kind; W.kind = 'polo';
  decorCells.forEach(d => drawDecor(g,{ k:d[0], x:d[1], y:d[2] }, 0));
  W.kind = wk;
  // placas das categorias
  [['CORPOS',2,0],['CABELOS',0,1],['CHAPÉUS',0,5],['SAPATOS',L.cols-1,1],['TINTAS',3,L.rows-1]].forEach(s => {
    const ox = s[1]*TILE, oy = s[2]*TILE+MT;
    g.fillStyle = '#5a3a1e'; g.fillRect(ox+18,oy+22,4,16);
    g.fillStyle = '#0b0e1f'; g.fillRect(ox+1,oy+8,38,17); g.fillStyle = '#d2a463'; g.fillRect(ox+2,oy+9,36,15); g.fillStyle = '#e6bd7e'; g.fillRect(ox+2,oy+9,36,2);
    g.fillStyle = '#3a2210'; g.font = 'bold 7px "Trebuchet MS", Verdana, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s[0], ox+20, oy+17);
  });
  // marcadores no chão, em frente a cada máquina
  L.machines.forEach(m => {
    if(m.kind==='table') return;
    const dx = m.x===0 ? 1 : m.x===L.cols-1 ? -1 : 0, dy = m.y===0 ? 1 : m.y===L.rows-1 ? -1 : 0;
    const x = (m.x+dx)*TILE, y = (m.y+dy)*TILE+MT, col = m.kind==='trash' ? '#9aa6c4' : m.kind==='door' ? '#ffd34d' : mainColor(m);
    g.globalAlpha = 0.22; g.fillStyle = col; g.fillRect(x+3,y+3,TILE-6,TILE-6); g.globalAlpha = 0.7;
    for(let i=4;i<TILE-4;i+=8){ g.fillRect(x+i,y+3,4,2); g.fillRect(x+i,y+TILE-5,4,2); g.fillRect(x+3,y+i,2,4); g.fillRect(x+TILE-5,y+i,2,4); }
    g.globalAlpha = 1;
  });
  return c;
}

/* ----------------------------- Salvar / carregar (MemoryCard v3) ----------------------------- */
function buildSave(phase){
  return { game:'FabricaDeBonecos', version:3, savedAt:new Date().toISOString(),
    phase, maxPhase:G.maxPhase, difficulty:diff(), bestStars:G.bestStars, night:G.night, north:G.north, bonus:{ dolls:G.bonus.dolls }, settings:G.settings };
}
function saveGame(phase){
  const text = JSON.stringify(buildSave(phase || G.phase), null, 2);
  try{
    const blob = new Blob([text], { type:'application/json' }), url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'MemoryCard.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('MemoryCard.json baixado!'); sfx('ui');
  }catch(e){
    openModal('<h2>MemoryCard</h2><p>Não consegui baixar o arquivo. Copie o texto abaixo e guarde num arquivo chamado <b>MemoryCard.json</b>:</p><textarea readonly id="saveTxt"></textarea><div class="row"><button class="primary" id="mOk" data-focus="1">OK</button></div>');
    $('saveTxt').value = text; $('mOk').onclick = () => closeModal();
  }
}
function applySave(data){
  mergeSettings(data.settings);
  if(DIFFS.includes(data.difficulty)) G.settings.difficulty = data.difficulty;
  applyAudioSettings(); saveSettingsLocal();
  G.bestStars = emptyStars();
  const bs = data.bestStars;
  if(bs && typeof bs==='object'){
    if(bs.facil || bs.medio || bs.dificil) DIFFS.forEach(d => { if(bs[d] && typeof bs[d]==='object') G.bestStars[d] = bs[d]; });
    else G.bestStars.medio = bs;                                 // MemoryCard antigo (v2)
  }
  G.night = { max:1, stars:emptyStars() };
  if(data.night && typeof data.night==='object'){
    if(typeof data.night.max==='number') G.night.max = clamp(Math.floor(data.night.max), 1, NIGHT_HOUSES.length);
    const ns = data.night.stars;
    if(ns && typeof ns==='object') DIFFS.forEach(d => { if(ns[d] && typeof ns[d]==='object') G.night.stars[d] = ns[d]; });
  }
  G.north = { max:1, stars:emptyStars(), done:false };
  if(data.north && typeof data.north==='object'){
    if(typeof data.north.max==='number') G.north.max = clamp(Math.floor(data.north.max), 1, 3);
    G.north.done = !!data.north.done;
    const ns2 = data.north.stars; if(ns2 && typeof ns2==='object') DIFFS.forEach(d => { if(ns2[d] && typeof ns2[d]==='object') G.north.stars[d] = ns2[d]; });
  }
  G.bonus = { dolls:emptyDolls() };
  if(data.bonus && Array.isArray(data.bonus.dolls)) data.bonus.dolls.slice(0,BONUS_TABLES).forEach((d,i) => { G.bonus.dolls[i] = sanitizeDoll(d); });
  const mp = typeof data.maxPhase==='number' ? Math.max(1, Math.min(16, Math.floor(data.maxPhase))) : 1;
  const ph = typeof data.phase==='number' ? Math.max(1, Math.min(15, Math.floor(data.phase))) : 1;
  G.maxPhase = Math.max(mp, ph); G.phase = ph;
  goVillage({ spawnPhase:true });
}
function readSaveFile(file, done){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.game!=='FabricaDeBonecos') throw new Error('x');
      done(data);
    }catch(err){ toast('Arquivo inválido 😕'); }
  };
  reader.readAsText(file);
}

/* ----------------------------- Dicas / HUD ----------------------------- */
function keyName(code){
  if(!code) return '—';
  const m = { ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→', Space:'Espaço', Semicolon:';', Comma:',', Period:'.', Slash:'/' };
  if(m[code]) return m[code];
  if(code.startsWith('Key')) return code.slice(3);
  if(code.startsWith('Digit')) return code.slice(5);
  return code;
}
function controlsHint(){
  const k = G.settings.keys.p1;
  return `Setas: andar  •  ${keyName(k.act)}: pegar / soltar  •  ${keyName(k.use)}: usar a máquina (mão vazia)`;
}
function worldHint(){ return 'Ande com as setas e aperte A virado para a porta de uma casa.'; }
function defaultHint(){ return Game.mode==='factory' ? controlsHint() : Game.mode==='house' ? houseHint() : Game.mode==='north' ? northHint() : worldHint(); }
let hintTimer = null;
function setHint(txt, sticky){
  $('hint').textContent = txt;
  clearTimeout(hintTimer);
  if(!sticky) hintTimer = setTimeout(()=>{ $('hint').textContent = defaultHint(); }, 3200);
}
let toastTimer = null;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1700);
}
function fmtTime(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
const hud = {};
function updateHUD(force){
  const set = (id, v) => { if(force || hud[id]!==v){ hud[id] = v; $(id).textContent = v; } };
  set('lblPhase', 'FASE '+G.phase+' · '+DIFF_LABEL[diff()]);
  set('lblTime', '⏱ '+fmtTime(L.timeLeft));
  $('lblTime').classList.toggle('warn', L.active && L.timeLeft<=15);
  set('dn', String(L.delivered));

    const g = L.lp.goals, top = g[2];
    $('gfill').style.width = Math.min(100, L.delivered/top*100)+'%';
    [0,1,2].forEach(i => {
      const u = $('gs'+(i+1));
      u.style.left = (g[i]/top*100)+'%';
      u.title = g[i]+' bonecos';
      u.classList.toggle('on', L.delivered>=g[i]);
    });

}
function fit(){
  const cv = $('game');
  const used = $('topbar').offsetHeight + ($('rail').style.display==='none' ? 0 : $('rail').offsetHeight) + $('hint').offsetHeight + 6*3 + 20;
  const availH = window.innerHeight - used - 8, availW = window.innerWidth - 32;
  const CW = cv.width, CH = cv.height;
  let s = Math.min(availW/CW, availH/CH);
  s = s>=2 ? Math.floor(s*2)/2 : Math.max(0.6, s);
  cv.style.width = Math.round(CW*s)+'px'; cv.style.height = Math.round(CH*s)+'px';
}

/* ----------------------------- Modais (com navegação por teclado) ----------------------------- */
function focusables(){
  const m = document.querySelector('#modalLayer .modal');
  return m ? Array.from(m.querySelectorAll('button:not(:disabled), input[type=range]')) : [];
}
function setFocus(el){
  focusables().forEach(b => b.classList.remove('focused'));
  if(el){ el.classList.add('focused'); if(el.scrollIntoView) el.scrollIntoView({ block:'nearest' }); }
}
function moveFocus(delta){
  const f = focusables(); if(!f.length) return;
  let i = f.findIndex(b => b.classList.contains('focused'));
  i = i<0 ? 0 : (i+delta+f.length) % f.length;
  setFocus(f[i]);
}
function openModal(html){
  G.paused = true; rebindTarget = null;
  const layer = $('modalLayer');
  layer.innerHTML = '<div class="modal">'+html+'</div>';
  layer.classList.add('show');
  const m = layer.firstChild, first = m.querySelector('[data-focus="1"]') || m.querySelector('button:not(:disabled)');
  setFocus(first);
}
function closeModal(){
  const layer = $('modalLayer');
  layer.classList.remove('show'); layer.innerHTML = '';

function modalKey(e){
  const c = e.code;
  if(rebindTarget){
    e.preventDefault();
    if(c==='Escape'){ const b = rebindTarget.back; rebindTarget = null; openSettings(b); return; }
    const keys = G.settings.keys, old = keys[rebindTarget.pl][rebindTarget.k];
    ['p1','p2'].forEach(pl => Object.keys(keys[pl]).forEach(a => {
      if(keys[pl][a]===c && !(pl===rebindTarget.pl && a===rebindTarget.k)) keys[pl][a] = old;
    }));
    keys[rebindTarget.pl][rebindTarget.k] = c;
    const bk = rebindTarget.back; rebindTarget = null; saveSettingsLocal(); sfx('ui'); openSettings(bk); return;
  }
  const f = focusables(), cur = f.find(b => b.classList.contains('focused'));
  if(c==='Escape'){
    const esc = document.querySelector('#modalLayer [data-esc="1"]');
    if(esc){ e.preventDefault(); esc.click(); }
    return;
  }
  if(cur && cur.type==='range' && (c==='ArrowLeft' || c==='ArrowRight')){
    e.preventDefault();
    cur.value = clamp(+cur.value + (c==='ArrowLeft'?-5:5), 0, 100);
    cur.dispatchEvent(new Event('input')); cur.dispatchEvent(new Event('change')); return;
  }
  if(c==='ArrowLeft' || c==='ArrowUp'){ e.preventDefault(); moveFocus(-1); sfx('ui'); return; }
  if(c==='ArrowRight' || c==='ArrowDown'){ e.preventDefault(); moveFocus(1); sfx('ui'); return; }
  const k = G.settings.keys.p1;
  if(c==='Enter' || c===k.act || c===k.use || c==='Space'){
    e.preventDefault();
    if(!e.repeat && cur && cur.tagName==='BUTTON') cur.click();
  }
}

function pushDir(p, d){ p.stack = p.stack.filter(x => x!==d); p.stack.push(d); }
function activePlayers(){
  if(Game.mode==='factory') return L.players;
  if(Game.mode==='house') return H.player ? [H.player] : [];
  if(Game.mode==='north') return N.player ? [N.player] : [];
  return W.player ? [W.player] : [];
}
function doAct(p){
  if(Game.fade) return;
  if(Game.mode==='factory') pressAct(p); else if(Game.mode==='house') housePressAct(p); else if(Game.mode==='north') cityPressUse(p); else worldPressAct(p);
}
function doUse(p){
  if(Game.fade) return;
  if(Game.mode==='factory') pressUse(p); else if(Game.mode==='house') housePressUse(p); else if(Game.mode==='north') cityPressUse(p);
}
function openPauseForMode(){
  if(Game.mode==='factory'){ if(L.active) L.bonus ? openBonusPause() : openPause(); }
  else if(Game.mode==='house'){ if(H.active) openHousePause(); }
  else if(Game.mode==='north'){ if(N.active) openCityPause(); }
  else openMapPause();
}
window.addEventListener('keydown', e => {
  Audio_.init(); Music.start();
  if(CUT.active){ cutKey(e); return; }
  if(G.paused){ modalKey(e); return; }
  if(e.code==='Escape'){ e.preventDefault(); openPauseForMode(); return; }
  const n = Game.mode==='factory' ? G.settings.players : 1;
  const ps = activePlayers();
  for(let i=0;i<n;i++){
    const k = G.settings.keys['p'+(i+1)], p = ps[i]; if(!p) continue;
    for(const d of ['up','down','left','right']) if(e.code===k[d]){
      e.preventDefault();
      if(stealthHidden()){ if(e.repeat) continue; stealthUnhide(); }
      pushDir(p,d);
    }
    if(e.code===k.act){ e.preventDefault(); if(!e.repeat) doAct(p); }
    if(e.code===k.use){ e.preventDefault(); if(!e.repeat) doUse(p); }
  }
});
window.addEventListener('keyup', e => {
  const n = Game.mode==='factory' ? G.settings.players : 1, ps = activePlayers();
  for(let i=0;i<n;i++){
    const k = G.settings.keys['p'+(i+1)], p = ps[i]; if(!p) continue;
    for(const d of ['up','down','left','right']) if(e.code===k[d]) p.stack = p.stack.filter(x => x!==d);
  }
});
window.addEventListener('blur', () => {
  [L.players, [W.player], [H.player], [N.player]].forEach(a => a.forEach(p => { if(p){ p.stack = []; p.padDir = null; } }));
  if(G.paused) return;
  if(Game.mode==='factory' && L.active) openPause();
  else if(Game.mode==='house' && H.active) openHousePause();
  else if(Game.mode==='north' && N.active) openCityPause();
});
document.addEventListener('pointerdown', () => { Audio_.init(); Music.start(); }, { once:true });
window.addEventListener('resize', fit);

const gpPrev = [{},{}];
function pollGamepad(){
  if(!navigator.getGamepads) return;
  const pads = Array.from(navigator.getGamepads() || []).filter(Boolean);
  if(!pads.length) return;
  const ps = activePlayers();
  ps.forEach((p,i) => {
    const gp = pads[G.settings.players===1 ? 0 : i]; if(!gp) return;
    const b = n => gp.buttons[n] && gp.buttons[n].pressed;
    const ax = gp.axes[0]||0, ay = gp.axes[1]||0;
    p.padDir = (b(12)||ay<-0.5) ? 'up' : (b(13)||ay>0.5) ? 'down' : (b(14)||ax<-0.5) ? 'left' : (b(15)||ax>0.5) ? 'right' : null;
    const a = b(0), z = b(2) || b(1), prev = gpPrev[i];
    if(a && !prev.a) doAct(p);
    if(z && !prev.z) doUse(p);
    prev.a = a; prev.z = z;
  });
}

  L.customers.forEach(cm => drawBubble(g,cm));
  if(L.active) L.players.forEach(p => drawTarget(g,p, p.id===0 ? '#ffe45c' : '#5ce0ff'));
  g.textAlign = 'center'; g.textBaseline = 'middle';
  L.fx.forEach(f => {
    if(f.k==='spark'){ g.globalAlpha = clamp(f.life/f.max,0,1); g.fillStyle = f.col; g.fillRect(Math.round(f.x),Math.round(f.y),3,3); g.globalAlpha = 1; }
    else {
      g.globalAlpha = clamp(f.life/0.4,0,1); g.font = 'bold 14px monospace';
      g.fillStyle = '#000'; g.fillText(f.txt, f.x+1, f.y+1); g.fillStyle = f.col; g.fillText(f.txt, f.x, f.y); g.globalAlpha = 1;
    }
  });
}
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000); lastT = t;
  updateFade(dt);
  if(Game.mode==='factory'){ update(dt); render(); }
  else if(Game.mode==='house'){ updateHouse(dt); renderHouse(); }
  else if(Game.mode==='north'){ updateNorth(dt); renderNorth(); }
  else { updateWorld(dt); renderWorld(); }
  Weather.update(dt, cv.width, cv.height); Weather.draw(ctx, cv.width, cv.height);
  drawFade(ctx, cv.width, cv.height);
  requestAnimationFrame(loop);
}

/* ----------------------------- Ícones (SVG embutido) ----------------------------- */
function gearPath(cx,cy,ro,ri,n,rh){
  let d = '', s = 2*Math.PI/n;
  for(let i=0;i<n;i++){
    const th = i*s - Math.PI/2;
    [[ri,th-0.30*s],[ro,th-0.17*s],[ro,th+0.17*s],[ri,th+0.30*s]].forEach((p,j) => {
      d += (i===0&&j===0?'M':'L') + (cx+p[0]*Math.cos(p[1])).toFixed(2) + ' ' + (cy+p[0]*Math.sin(p[1])).toFixed(2) + ' ';
    });
  }
  return d + 'Z M'+(cx+rh)+' '+cy+' A'+rh+' '+rh+' 0 1 0 '+(cx-rh)+' '+cy+' A'+rh+' '+rh+' 0 1 0 '+(cx+rh)+' '+cy+' Z';
}
function setIcons(){
  $('btnSettings').innerHTML = '<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="'+gearPath(12,12,11,8,8,3.6)+'"/></svg>';
  $('btnSave').innerHTML = '<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 3H17L21 7V21H3Z M7 3H15V8H7Z M6 13H18V21H6Z"/></svg>';
  $('btnLevels').innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2 L22 11 H19 V21 H14 V14 H10 V21 H5 V11 H2 Z"/></svg>';
}

function worldSetup(kind){
  W.kind = kind; W.houses = []; W.decor = []; W.gate = null; W.arch = null; W.focus = null; W.lastHint = '';
  const solid = (x,y) => { W.solid[y][x] = true; };
  if(kind==='hub'){
    W.cols = 15; W.rows = 11;
  } else if(kind==='village'){
    W.cols = 21; W.rows = 13;
  } else if(kind==='polo'){ W.cols = 15; W.rows = 11; }
  else if(kind==='polo'){ W.cols = 15; W.rows = 11; }
  else { W.cols = 21; W.rows = 10; }
  W.solid = Array.from({length:W.rows}, () => Array(W.cols).fill(false));
  for(let x=0;x<W.cols;x++){ solid(x,0); solid(x,W.rows-1); }
  for(let y=0;y<W.rows;y++){ solid(0,y); solid(W.cols-1,y); }
  const addHouse = (o) => {
    o.w = 3; o.h = 2; W.houses.push(o);
    for(let yy=o.y; yy<o.y+2; yy++) for(let xx=o.x; xx<o.x+3; xx++) solid(xx,yy);
    o.door = { x:o.x+1, y:o.y+1 }; o.stand = { x:o.x+1, y:o.y+2 };
  };
  const addDecor = (k,x,y) => { W.decor.push({ k,x,y }); solid(x,y); };
  if(kind==='hub'){
    addHouse({ id:'play',  x:1,  y:3, label:'VILA DO PAPAI NOEL',  pal:SANTA_PAL[0] });
    addHouse({ id:'night', x:6,  y:3, label:'VILA NOTURNA', pal:NIGHT_PAL[1] });
    addHouse({ id:'bonus', x:11, y:3, label:'POLO NORTE', pal:SANTA_PAL[4] });
    addHouse({ id:'level', x:1,  y:7, label:'NÍVEL',  pal:SANTA_PAL[1] });
    addHouse({ id:'card',  x:6,  y:7, label:'MEMORYCARD', pal:SANTA_PAL[2] });
    addHouse({ id:'set',   x:11, y:7, label:'AJUSTES', pal:SANTA_PAL[3] });
    addDecor('tree',0+1,9); addDecor('tree',13,9); addDecor('snowman',3,6); addDecor('lamp',7,6);
    addDecor('gift',1,6); addDecor('gift',13,6);
  } else if(kind==='village'){
    for(let i=0;i<15;i++){
      const r = Math.floor(i/5), c = i%5;
      addHouse({ id:i+1, x:1+c*4, y:1+r*4, label:String(i+1), pal:SANTA_PAL[i%5] });
    }
    for(let r=0;r<3;r++){
      for(const gx of [4,8,12,16]){
        const y = 1+r*4;
        if(r>0 && (gx===4 || gx===12)) { continue; }
        if(r===0 || gx===8 || gx===16){ addDecor(gx===8 ? 'lamp' : (gx===16 ? 'snowman' : 'tree'), gx, y); }
      }
    }
    addDecor('tree',4,2); addDecor('tree',12,2); addDecor('lamp',4,1); addDecor('lamp',12,1);
    addDecor('gift',8,2); addDecor('gift',8,6); addDecor('gift',16,6); addDecor('gift',8,10);
    W.gate = { x:W.cols-1, y:11, stand:{x:W.cols-2,y:11} };
    W.solid[11][W.cols-1] = true;
  } else if(kind==='polo'){
    addHouse({ id:'oficina', x:6, y:3, label:'OFICINA', pal:SANTA_PAL[0] });
    addDecor('pole',10,7); addDecor('snowman',3,7); addDecor('snowman',12,7); addDecor('tree',2,3); addDecor('tree',12,3); addDecor('gift',4,8); addDecor('gift',9,8); addDecor('lamp',5,5); addDecor('lamp',9,5);
  } else {
    for(let i=0;i<10;i++){
      const r = Math.floor(i/5), c = i%5;
      addHouse({ id:i, x:1+c*4, y:1+r*4, label:String(i+1), pal:NIGHT_PAL[(i*2)%5] });
    }
    for(const gx of [4,8,12,16]){ addDecor(gx===8||gx===16 ? 'lamp' : 'bush', gx, 1); addDecor(gx===4||gx===12 ? 'bush' : 'mail', gx, 2); }
    addDecor('lamp',8,5); addDecor('lamp',16,5);
    W.arch = { x:0, y:8 };
    W.solid[8][0] = false;
    W.gate = { x:W.cols-1, y:8, stand:{x:W.cols-2,y:8} };
    W.solid[8][W.cols-1] = true;
  }
  W.houses.forEach(h => { W.solid[h.door.y][h.door.x] = true; });

function worldReachCheck(){            // todas as portas e a saída precisam ser alcançáveis
  const p = W.player, seen = new Set([p.gx+','+p.gy]), q = [[p.gx,p.gy]];
  while(q.length){ const c = q.pop(); for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = c[0]+d[0], ny = c[1]+d[1], k = nx+','+ny; if(!seen.has(k) && worldWalkable(nx,ny)){ seen.add(k); q.push([nx,ny]); } } }
  const bad = W.houses.filter(h => !seen.has(h.stand.x+','+h.stand.y)).map(h => h.id);
  if(W.gate && !seen.has(W.gate.stand.x+','+W.gate.stand.y)) bad.push('gate');
  return bad;
}
const gateOpen = () => W.kind==='night' ? part2Done() : part1Done();
function worldWalkable(x,y){
  if(x<0||y<0||x>=W.cols||y>=W.rows) return false;
  if(W.arch && x===W.arch.x && y===W.arch.y) return true;
  if(W.gate && x===W.gate.x && y===W.gate.y) return gateOpen();
  return !W.solid[y][x];
}
function houseUnlocked(h){
  if(W.kind==='village') return h.id <= G.maxPhase;
  if(W.kind==='night') return h.id < G.night.max;
  if(h.id==='night') return part1Done();
  if(h.id==='bonus') return !!G.north.done;
  return true;
}
function houseStars(h){
  if(W.kind==='village') return starsOf(h.id);
  if(W.kind==='night') return nightStarsOf(h.id);
  return 0;
}
function spawnAt(x,y,dir){
  W.player = { id:0, gx:x, gy:y, fromX:x, fromY:y, t:1, moving:false, dir:dir||'down', stack:[], padDir:null, px:x*TILE, py:y*TILE, carry:null };
}
function currentHouse(){            // casa "da vez" (mais avançada liberada)
  if(W.kind==='village') return Math.min(G.maxPhase, 15);
  if(W.kind==='night') return G.night.max-1;
  return null;
}

/* --- abrir mundo --- */
function openWorld(kind, opts){
  opts = opts || {};
  closeModal(); MT = 16; worldSetup(kind);
  cv.width = W.cols*TILE; cv.height = W.rows*TILE + MT;
  W.bg = buildWorldBg(); W.time = 0;
  if(kind==='hub'){ const hb = opts.fromBonus && W.houses.find(o => o.id==='bonus'); if(hb) spawnAt(hb.stand.x, hb.stand.y, 'down'); else spawnAt(7,5,'down'); }
  else if(kind==='polo') spawnAt(7,8,'up');
  else if(kind==='village'){
    if(opts.gate){ spawnAt(W.cols-2,11,'right'); W.gateAnim = 0; }
    else if(opts.fromNight){ spawnAt(W.cols-2,11,'left'); W.gateAnim = 1; }
    else {
      W.gateAnim = 1;
      const ph = Math.max(1, Math.min(15, opts.spawnPhase ? G.phase : (opts.phase || G.phase)));
      const h = W.houses.find(o => o.id===ph) || W.houses[0];
      spawnAt(h.stand.x, h.stand.y, 'up');
    }
  } else {
    W.gateAnim = 1;
    if(opts.gate){ spawnAt(W.cols-2,8,'right'); W.gateAnim = 0; }
    else if(opts.fromNorth){ spawnAt(W.cols-2,8,'left'); }
    else if(opts.fromHouse!=null){ const h = W.houses.find(o => o.id===opts.fromHouse); spawnAt(h.stand.x, h.stand.y, 'down'); }
    else spawnAt(1,8,'right');
  }
  setMode(kind);
  updateWorldHUD(); setHint(worldHint(), true); fit();
}
function goVillage(opts){ fadeIfNeeded(() => openWorld('village', opts)); }
function fadeIfNeeded(cb){ if(Game.fade || Game.first){ cb(); Game.first = false; } else fadeTo(cb); }

  const t = W.kind==='hub' ? '🏠 Início' : W.kind==='polo' ? '⭐ Polo Norte' : W.kind==='village' ? '🎅 Vila do Papai Noel · '+DIFF_LABEL[diff()] : '🌙 Vila Noturna · '+DIFF_LABEL[diff()];

}

/* --- fundo estático --- */
function buildWorldBg(){
  const CW = W.cols*TILE, CH = W.rows*TILE+MT;
  const c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const r = mulberry32(W.kind==='hub' ? 11 : W.kind==='village' ? 22 : 33);
  const night = W.kind==='night';
  g.fillStyle = night ? '#16203a' : '#dfe9f7'; g.fillRect(0,0,CW,CH);
  // chão
  for(let y=0;y<W.rows;y++) for(let x=0;x<W.cols;x++){
    const ox = x*TILE, oy = y*TILE+MT;
    if(night){
      g.fillStyle = (x+y)&1 ? '#1f3a3a' : '#1b3434'; g.fillRect(ox,oy,TILE,TILE);
      for(let i=0;i<5;i++){ g.fillStyle = '#2a5048'; g.fillRect(ox+((r()*34)|0), oy+((r()*36)|0), 2, 3); }
    } else {
      g.fillStyle = (x+y)&1 ? '#eef4ff' : '#e3ecfa'; g.fillRect(ox,oy,TILE,TILE);
      for(let i=0;i<3;i++){ g.fillStyle = '#ffffff'; g.fillRect(ox+((r()*34)|0), oy+((r()*36)|0), 3, 2); }
      g.fillStyle = '#cdd9ee'; g.fillRect(ox+((r()*30)|0), oy+((r()*34)|0), 4, 1);
    }
  }
  // caminhos
  const pathTile = (x,y) => {
    const ox = x*TILE, oy = y*TILE+MT;
    if(night){ g.fillStyle = '#3a3f52'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#464c62'; g.fillRect(ox,oy,TILE,3); g.fillStyle = '#e6d27a'; if(!((x)%2)) g.fillRect(ox+4,oy+19,14,2); }
    else { g.fillStyle = (x+y)&1 ? '#d8c9aa' : '#cfbf9e'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#e8dcc2'; g.fillRect(ox+3,oy+3,12,7); g.fillRect(ox+22,oy+20,12,8); g.fillStyle = '#b8a888'; g.fillRect(ox,oy+TILE-1,TILE,1); }
  };
  if(W.kind==='polo'){ for(let y=5;y<=6;y++) for(let x=1;x<W.cols-1;x++) pathTile(x,y); for(let y=7;y<=9;y++) pathTile(7,y); }
  else if(W.kind==='hub'){ for(let y=5;y<=6;y++) for(let x=1;x<W.cols-1;x++) pathTile(x,y); for(let y=9;y<=9;y++) for(let x=1;x<W.cols-1;x++) pathTile(x,y); for(let y=3;y<=8;y++){ if(y<5||y>6) { pathTile(2,y>6?y:y); } } }
  else if(W.kind==='village'){
    for(const y of [3,4,7,8,11]) for(let x=1;x<W.cols-1;x++) pathTile(x,y);
    for(const y of [5,6,9,10]) for(const x of [4,12]) pathTile(x,y);
  } else {
    for(const y of [3,4,7,8]) for(let x=1;x<W.cols-1;x++) pathTile(x,y);
    for(const y of [5,6]) for(const x of [4,12]) pathTile(x,y);
  }
  // borda: árvores
  for(let x=0;x<W.cols;x++){ drawPine(g,x,0,night); drawPine(g,x,W.rows-1,night); }
  for(let y=1;y<W.rows-1;y++){ drawPine(g,0,y,night); drawPine(g,W.cols-1,y,night); }
  if(W.arch){ const ox = W.arch.x*TILE, oy = W.arch.y*TILE+MT; pathTile(W.arch.x, W.arch.y); drawArch(g, ox, oy, '#8a6a3a'); }
  if(W.kind==='hub') drawTitle(g, CW);
  if(W.kind==='village'){ drawBanner(g, CW, '🎅  VILA DO PAPAI NOEL  🎄'); }
  if(W.kind==='polo') drawPoloSky(g, CW);
  if(night) drawNightSky(g, CW);
  return c;
}
function drawPine(g,x,y,night){
  const ox = x*TILE, oy = y*TILE+MT;
  g.fillStyle = night ? '#16203a' : '#cdd9ee'; g.fillRect(ox,oy,TILE,TILE);
  const base = night ? ['#1e4a3a','#23603f','#2a7448'] : ['#2f7a4a','#3b9a5c','#4cb36f'];
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(ox+6,oy+36,28,3);
  g.fillStyle = '#5a3a1e'; g.fillRect(ox+17,oy+30,6,8);
  for(let i=0;i<3;i++){
    const w = 30-i*7, yy = oy+26-i*9;
    g.fillStyle = base[i]; g.beginPath(); g.moveTo(ox+20,yy-12); g.lineTo(ox+20+w/2,yy+4); g.lineTo(ox+20-w/2,yy+4); g.closePath(); g.fill();
    g.fillStyle = night ? '#cfe0ff' : '#ffffff'; g.fillRect(ox+20-w/4,yy-5+(i?0:0),w/2,2);
  }
  g.fillStyle = '#ffd34d'; g.fillRect(ox+19,oy+3,3,3);
}

function drawPoloSky(g,CW){

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r = n>>16, gg = (n>>8)&255, b = n&255;
  const f = v => Math.max(0,Math.min(255, Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt)));
  return '#'+((1<<24)+(f(r)<<16)+(f(gg)<<8)+f(b)).toString(16).slice(1);
}

/* --- atualização --- */
function updateWalker(p, dt, walk){
  if(p.moving){ p.t += dt/STEP; if(p.t>=1){ p.t = 1; p.moving = false; p.arrived = true; } }
  if(!p.moving){
    const dir = dirOf(p);
    if(dir){
      p.dir = dir; const d = DIRS[dir], nx = p.gx+d.x, ny = p.gy+d.y;
      if(walk(nx,ny)){ p.fromX = p.gx; p.fromY = p.gy; p.gx = nx; p.gy = ny; p.moving = true; p.t = 0; p.arrived = false; }
    }
  }
  p.px = lerp(p.fromX, p.gx, p.t)*TILE; p.py = lerp(p.fromY, p.gy, p.t)*TILE;
}
function worldFront(){ const p = W.player, d = DIRS[p.dir]; return { x:p.gx+d.x, y:p.gy+d.y }; }
function houseAtDoor(x,y){ return W.houses.find(h => h.door.x===x && h.door.y===y); }
function focusHint(){
  const f = W.focus; let txt = worldHint();
  if(f && f.house){
    const h = f.house, un = houseUnlocked(h);
    if(W.kind==='hub'){
      txt = {
        play: 'A: entrar na Vila do Papai Noel (fase '+Math.min(15,G.maxPhase)+')',
        night: part1Done() ? 'A: ir para a vila noturna' : '🔒 Termine a fase 15 para liberar a vila noturna',
        bonus: G.north.done ? 'A: entrar no quintal do Polo Norte (fase bônus)' : '🔒 Chegue ao Polo Norte para liberar a fase bônus',
        level: 'A: escolher o nível ('+DIF_LABEL_NOW()+')',
        card: 'A: salvar ou carregar o MemoryCard',
        set: 'A: som, controles e jogadores'
      }[h.id];
    } else if(W.kind==='village') txt = un ? 'A: entrar na fase '+h.id+(starsOf(h.id)?'  ('+'★'.repeat(starsOf(h.id))+')':'') : '🔒 Termine a fase '+(h.id-1)+' primeiro';
    else if(W.kind==='polo') txt = 'A: entrar na oficina (voltar ao início)';
    else txt = un ? 'A: entrar na '+NIGHT_HOUSES[h.id].name : '🔒 Termine a casa '+h.id+' primeiro';
  } else if(f && f.gate){
    txt = W.kind==='night' ? (gateOpen() ? 'Entre pela trilha à direita: o caminho para o Polo Norte!' : '🔒 A trilha abre quando você terminar a casa 10') : (gateOpen() ? 'Entre pela portinha à direita!' : '🔒 A portinha abre quando você terminar a fase 15');
  }
  return txt;
}
const DIF_LABEL_NOW = () => DIFF_LABEL[diff()];
function updateWorld(dt){
  W.time += dt;
  if((W.kind==='village'||W.kind==='night') && gateOpen() && W.gateAnim<1) W.gateAnim = Math.min(1, W.gateAnim + dt/1.4);
  if(G.paused || Game.fade) return;
  pollGamepad();
  const p = W.player; if(!p) return;
  updateWalker(p, dt, worldWalkable);
  // foco (casa à frente)
  const f = worldFront(); let focus = null;
  const hs = houseAtDoor(f.x,f.y);
  if(hs && !p.moving) focus = { house:hs };
  else if(W.gate && f.x===W.gate.x && f.y===W.gate.y) focus = { gate:true };
  const key = focus ? (focus.house ? 'h'+focus.house.id : 'g') : '';
  W.focus = focus;
  if(key!==W.lastHint){ W.lastHint = key; setHint(focusHint(), true); }
  if(p.arrived){
    p.arrived = false;
    if(W.arch && p.gx===W.arch.x && p.gy===W.arch.y){ sfx('gate'); goVillage({ fromNight:true }); p.stack = []; }
    else if(W.gate && p.gx===W.gate.x && p.gy===W.gate.y && gateOpen()){ sfx('gate'); p.stack = []; if(W.kind==='night') fadeTo(() => startCity(Math.min(2, G.north.max-1))); else fadeTo(() => openWorld('night')); }
  }
}
function worldPressAct(){
  const p = W.player; if(!p || p.moving) return;
  const f = worldFront(), hs = houseAtDoor(f.x,f.y);
  if(hs){ activateHouse(hs); return; }
  if(W.gate && f.x===W.gate.x && f.y===W.gate.y && !gateOpen()){ sfx('deny'); toast(W.kind==='night' ? 'A trilha só abre depois da casa 10 🔒' : 'A portinha só abre depois da fase 15 🔒'); }
}
function activateHouse(h){
  if(!houseUnlocked(h)){
    sfx('deny');
    toast(W.kind==='village' ? 'Termine a fase '+(h.id-1)+' primeiro 🔒' : W.kind==='night' ? 'Termine a casa '+h.id+' primeiro 🔒' : h.id==='bonus' ? 'Chegue ao Polo Norte primeiro 🔒' : 'Termine a fase 15 primeiro 🔒');
    return;
  }
  sfx('ui');
  if(W.kind==='polo'){ fadeTo(() => openWorld('hub')); return; }
  if(W.kind==='village') fadeTo(() => startPhase(h.id));
  else if(W.kind==='night') fadeTo(() => startHouse(h.id));
  else {
    const id = h.id;
    if(id==='play') fadeTo(() => openWorld('village', { spawnPhase:true }));
    else if(id==='night') fadeTo(() => openWorld('night'));
    else if(id==='bonus') fadeTo(() => startBonus(false));
    else if(id==='level') openDifficulty(null, null);
    else if(id==='card') openHubMemory();
    else if(id==='set') openSettings(null);
  }
}

function renderWorld(){
  const g = ctx; g.imageSmoothingEnabled = false;
  if(!W.bg) return;
  g.drawImage(W.bg,0,0);
  if(W.kind==='night') { /* postes brilham no pós-processamento */ }
  const items = [];
  W.houses.forEach(h => items.push({ y:h.y+2, f:() => drawHouseSprite(g,h,W.time) }));
  W.decor.forEach(d => items.push({ y:d.y+1-(d.k==='sleigh'?0.2:0), f:() => drawDecor(g,d,W.time) }));
  if(W.gate) drawGate(g, W.time);
  const p = W.player;
  if(p) items.push({ y:p.py/TILE+0.9, f:() => drawWorldPlayer(g,p) });
  items.sort((a,b) => a.y-b.y).forEach(i => i.f());
  // seta "da vez"
  const cur = currentHouse();
  if(cur!=null && W.kind!=='hub'){

      g.fillStyle = '#ffd34d'; g.beginPath(); g.moveTo(ax-6,ay-7); g.lineTo(ax+6,ay-7); g.lineTo(ax,ay+1); g.closePath(); g.fill();
    }
  }
  if(W.kind==='hub'){
    const h = W.houses[0], bob = Math.sin(W.time*5)*3, ax = h.x*TILE+60, ay = h.y*TILE+MT-10+bob;
    g.fillStyle = '#0b0e1f'; g.beginPath(); g.moveTo(ax-8,ay-8); g.lineTo(ax+8,ay-8); g.lineTo(ax,ay+4); g.closePath(); g.fill();
    g.fillStyle = '#ffd34d'; g.beginPath(); g.moveTo(ax-6,ay-7); g.lineTo(ax+6,ay-7); g.lineTo(ax,ay+1); g.closePath(); g.fill();
  }

  }

    });

function drawWorldPlayer(g,p){

function startHouse(i){ prepareHouse(i); showHouseIntro(); }
function prepareHouse(i){
  closeModal(); MT = 16; H.idx = i;
  const def = NIGHT_HOUSES[i], h = parseHouse(def), par = nightParams(i, diff());
  H.def = def; H.h = h; H.par = par;
  cv.width = h.cols*TILE; cv.height = h.rows*TILE + MT;
  H.kids = h.kids.map((k,n) => ({
    i:n, name:k.name, head:k.head, bed:k.bed, spot:k.spot, room:k.room, face:k.face, look:k.face, lookIdx:0,
    state:'sleep', t:2.5 + n*1.0 + rnd(par.sleep[0], par.sleep[1]), alert:0, glow:0, litSet:null, lookT:0, done:false, bub:0
  }));
  H.presents = h.presents.map((p,n) => ({ x:p.x, y:p.y, kid:n, state:'floor' }));   // 'floor' | 'carried' | 'placed'
  H.placed = 0; H.carried = null; H.time = 0; H.peak = 0; H.hidden = false; H.fx = []; H.end = null; H.endTimer = 0; H.shake = 0; H.exitMsg = 0;
  H.active = false;
  const s = h.start;
  H.player = { id:0, gx:s.x, gy:s.y, fromX:s.x, fromY:s.y, t:1, moving:false, dir:'up', stack:[], padDir:null, px:s.x*TILE, py:s.y*TILE, carry:null };
  H.creaks = par.creaks ? pickCreaks(h, i, par.creaks) : []; H.rings = []; H.padWas = false;
  H.bg = buildHouseBg();
  H.kids.forEach(k => { k.litSet = computeLit(k); });
  setMode('house');
  updateHouseHUD(true); setHint('', true); fit();
}
function rnd(a,b){ return a + Math.random()*(b-a); }
function beginHouse(){ closeModal(); H.active = true; sfx('creak'); setHint(houseHint(), true); }

/* --- luz / visão --- */
function computeLit(k){
  const set = new Set(), h = H.h;
  for(let y=0;y<h.rows;y++) for(let x=0;x<h.cols;x++){
    const t = h.tok[y][x];
    if(t==='#' ) continue;
    if(kidSees(h, k, H.par, x, y)) set.add(x+','+y);
  }
  return set;
}
function playerLit(){
  const p = H.player;
  if(H.hidden) return null;
  for(const k of H.kids) if(k.state==='awake' && k.litSet.has(p.gx+','+p.gy)) return k;
  return null;
}
const CW_ = { up:'right', right:'down', down:'left', left:'up' };
const CCW_ = { up:'left', left:'down', down:'right', right:'up' };
function lookSeq(k){ return [k.face, CW_[k.face], k.face, CCW_[k.face]]; }

/* --- atualização --- */
function houseWalkable(x,y){
  const h = H.h;
  if(!houseWalk(h,x,y)) return false;
  if(h.tok[y][x]==='D' && H.placed < H.kids.length){ if(H.exitMsg<=0){ H.exitMsg = 1.2; toast('Ainda faltam presentes! 🎁'); sfx('deny'); } return false; }
  return true;
}
function updateHouse(dt){
  if(!H.h) return;
  H.time += dt; if(H.exitMsg>0) H.exitMsg -= dt; if(H.shake>0) H.shake = Math.max(0,H.shake-dt);
  H.hideT = lerp(H.hideT, H.hidden ? 1 : 0, Math.min(1, dt*12));
  H.fx.forEach(f => { f.life -= dt; if(f.k==='spark'){ f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 160*dt; } else f.y -= 26*dt; });
  H.fx = H.fx.filter(f => f.life>0);
  H.rings.forEach(r => r.t += dt); H.rings = H.rings.filter(r => r.t<0.8);
  H.kids.forEach(k => { // brilho da luz acompanha o estado
    const target = k.state==='awake' ? 1 : (k.state==='stir' ? 0.18+0.16*Math.sin(H.time*14) : 0);
    k.glow = lerp(k.glow, target, Math.min(1, dt*9));
  });
  if(H.end){ H.endTimer -= dt; if(H.endTimer<=0 && H.end.pending){ H.end.pending = false; H.end.cb(); } return; }
  if(!H.active || G.paused || Game.fade) return;
  pollGamepad();
  const p = H.player;
  // movimento (mexer cancela o esconderijo)
  if(H.hidden && p.padDir && !H.padWas) H.hidden = false;
  H.padWas = !!p.padDir;
  if(!H.hidden) updateWalker(p, dt, houseWalkable);
  // crianças
  H.kids.forEach(k => {
    k.t -= dt;
    if(k.state==='sleep' && k.t<=0){ k.state = 'stir'; k.t = H.par.stir; sfx('stir'); k.bub = 1; }
    else if(k.state==='stir' && k.t<=0){ k.state = 'awake'; k.t = H.par.awake * (0.85+Math.random()*0.3); sfx('wake'); k.lookIdx = 0; k.look = k.face; k.lookT = H.par.sweep || 0; k.litSet = computeLit(k); }
    else if(k.state==='awake'){
      if(H.par.rule==='cone' && H.par.sweep>0){
        k.lookT -= dt;
        if(k.lookT<=0){ k.lookIdx = (k.lookIdx+1)%4; k.look = lookSeq(k)[k.lookIdx]; k.lookT = H.par.sweep; k.litSet = computeLit(k); }
      }
      if(k.t<=0){ k.state = 'sleep'; k.t = rnd(H.par.sleep[0], H.par.sleep[1]) * (k.done ? 1.4 : 1); sfx('creak'); }
    }
  });
  // visibilidade → alerta
  const seenBy = playerLit();
  let maxA = 0;
  H.kids.forEach(k => {
    if(seenBy===k){ k.alert = Math.min(1.001, k.alert + dt/H.par.react); if(((k.alert*10)|0)!==(((k.alert-dt/H.par.react)*10)|0)) sfx('alert'); }
    else k.alert = Math.max(0, k.alert - dt/(H.par.react*0.7));
    maxA = Math.max(maxA, k.alert);
  });
  H.peak = Math.max(H.peak, maxA);
  if(maxA>=1){ caughtByKid(seenBy); return; }
  // chegada na porta com tudo escondido
  if(p.arrived){
    p.arrived = false;
    if(H.creaks.some(c => c.x===p.gx && c.y===p.gy)) makeNoise(p);
    if(H.h.tok[p.gy][p.gx]==='D' && H.placed===H.kids.length){ finishHouse(); return; }
  }
  updateHouseHUD(false);
}
function makeNoise(p){
  sfx('creak'); setTimeout(() => sfx('creak'), 90);
  H.rings.push({ x:p.gx*TILE+20, y:p.gy*TILE+MT+20, t:0 });
  popupH(p.px+20, p.py+MT-10, 'CREC!', '#ffb84a'); H.shake = Math.max(H.shake, 0.12);
  H.kids.forEach(k => {
    const d = Math.hypot(k.head.x-p.gx, k.head.y-p.gy);
    if(k.state==='sleep' && d<=7){ k.state = 'stir'; k.t = H.par.stir*0.8; sfx('stir'); }
    else if(k.state==='awake' && d<=7) k.t += 1;
  });
}
function caughtByKid(k){
  H.active = false; H.player.stack = []; H.shake = 0.6; sfx('seen');
  H.end = { pending:true, cb:() => showCaught(k) }; H.endTimer = 0.9;
}
function finishHouse(){
  H.active = false; H.player.stack = []; sfx('star');
  const stars = H.peak < 0.04 ? 3 : (H.peak < 0.6 ? 2 : 1);
  const firstNorth = H.idx === NIGHT_HOUSES.length-1 && !part2Done();
  const bs = G.night.stars[diff()]; if(!bs[H.idx] || stars>bs[H.idx]) bs[H.idx] = stars;
  const last = H.idx === NIGHT_HOUSES.length-1;
  if(!last) G.night.max = Math.max(G.night.max, H.idx+2);
  H.end = { pending:true, cb:() => showHouseDone(stars, last, firstNorth) }; H.endTimer = 0.6;
}

/* --- ações --- */
function frontOf(p){ const d = DIRS[p.dir]; return { x:p.gx+d.x, y:p.gy+d.y }; }
function housePressAct(p){
  if(!H.active || G.paused || p.moving) return;
  if(H.hidden){ H.hidden = false; return; }
  const f = frontOf(p), h = H.h;
  if(H.carried == null){
    const pr = H.presents.find(q => q.state==='floor' && ((q.x===f.x && q.y===f.y) || (q.x===p.gx && q.y===p.gy)));
    if(pr){ pr.state = 'carried'; H.carried = pr.kid; sfx('pick'); setHint(houseHint(), true); return; }
    sfx('deny'); return;
  }
  const pr = H.presents.find(q => q.kid===H.carried);
  const t = h.tok[f.y] && h.tok[f.y][f.x], si = SPOT_CH.indexOf(t);
  if(si>=0 && h.kids[si]){
    if(si===H.carried){
      pr.state = 'placed'; H.carried = null; H.placed++; H.kids[si].done = true;
      sfx('gift'); sparkles(f.x*TILE+20, f.y*TILE+MT+14, KID_COL[si]); popupH(f.x*TILE+20, f.y*TILE+MT, 'Escondido! 🎁', '#ffe45c');
      if(H.placed===H.kids.length) sfx('gate');
      setHint(houseHint(), true);
    } else { sfx('bad'); popupH(f.x*TILE+20, f.y*TILE+MT, 'É de outra criança!', '#ff8a96'); }
    return;
  }
  // soltar no chão (casa livre à frente)
  if(houseWalk(h,f.x,f.y) && t!=='D' && !H.presents.some(q => q.state==='floor' && q.x===f.x && q.y===f.y)){
    pr.state = 'floor'; pr.x = f.x; pr.y = f.y; H.carried = null; sfx('drop'); setHint(houseHint(), true);
  } else sfx('deny');
}
function housePressUse(p){
  if(!H.active || G.paused || p.moving) return;
  if(H.hidden){ H.hidden = false; return; }
  const f = frontOf(p), t = H.h.tok[f.y] && H.h.tok[f.y][f.x];
  if(t && HIDEABLE.includes(t)){ H.hidden = true; H.hideAt = f; p.stack = []; H.padWas = !!p.padDir; sfx('hide'); popupH(p.px+20, p.py+MT-4, 'shh...', '#cfe8ff'); }
  else { sfx('deny'); popupH(p.px+20, p.py+MT-4, 'nada para se esconder', '#ffb0b8'); }
}
function popupH(x,y,txt,col){ H.fx.push({ k:'text', x, y, txt, col:col||'#fff', life:1.1, max:1.1 }); }
function sparkles(x,y,col){ for(let i=0;i<14;i++){ const a = Math.random()*6.28, v = 40+Math.random()*90; H.fx.push({ k:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-60, col:i%3?col:'#fff', life:0.5+Math.random()*0.4, max:0.9 }); } }

/* --- HUD --- */
function updateHouseHUD(force){
  const set = (id, v) => { if(force || hud[id]!==v){ hud[id] = v; $(id).textContent = v; } };
  set('lblPhase', 'CASA '+(H.idx+1)+' · '+DIFF_LABEL[diff()]);
  set('lblTime', '🎁 '+H.placed+'/'+H.kids.length);
  let m = 0; H.kids.forEach(k => { m = Math.max(m, k.alert); });
  $('afill').style.width = Math.min(100, m*100)+'%';
  $('afill').classList.toggle('hot', m>0.6);
  $('lblTime').classList.remove('warn');
}

/* --- fases: modais --- */

  const d = H.def, i = H.idx, light = d.rule==='light';
  openModal(`
    <h2>🌙 Casa ${i+1}: ${d.name}</h2>
    <p>${light ? '💡 <b>Regra: onde ficar claro, você é visto.</b> A criança acorda e acende a luz do quarto.' : '👁️ <b>Regra: o cone de luz é o que a criança enxerga.</b> Ela olha para um lado de cada vez.'}</p>
    <p style="font-size:13px;">${d.tip}</p>
    <div class="chips">${H.kids.map(k => `<span class="chip" style="border-color:${KID_COL[k.i]};color:${KID_COL[k.i]}">🎁 ${k.name}</span>`).join('')}</div>
    ${H.par.creaks ? '<p style="font-size:13px;">🔊 <b>Novo: tábuas que rangem!</b> Pisar nas tábuas claras com rachaduras faz barulho e acorda as crianças. Dê a volta!</p>' : ''}
    <p style="font-size:12px;"><b>A</b> pega e solta o presente • <b>Z</b> esconde você • Saia pela porta da frente quando terminar. 3 estrelas: nunca ser notado!</p>
    ${diffSegHTML()}
    <div class="row"><button class="primary" id="mGo" data-focus="1">▶ Entrar na casa</button><button id="mLv" data-esc="1">🌙 Voltar às casinhas</button></div>`);

function showCaught(k){
  const i = H.idx;
  openModal(`
    <h2>😱 ${k.name} viu o Papai Noel!</h2>
    <p>A criança acordou e te encontrou no claro. Os presentes ficam para a próxima tentativa — dica: assim que a criança se mexer, vá para perto de um móvel e aperte <b>Z</b>.</p>
    <div class="row"><button class="primary" id="mRetry" data-focus="1">🔁 Tentar de novo</button><button id="mLv">🌙 Voltar às casinhas</button></div>`);
  $('mRetry').onclick = () => startHouse(i);
  $('mLv').onclick = () => fadeTo(() => { closeModal(); openWorld('night', { fromHouse:i }); });
}
function showHouseDone(stars, last, firstNorth){
  const i = H.idx;
  openModal(`
    <h2>🎁 Casa ${i+1} concluída!</h2>
    <div class="stars">${starHTML(stars)}</div>
    <p>${stars===3 ? 'Ninguém percebeu nada. Perfeito, Papai Noel! 🤫' : stars===2 ? 'Quase foi visto, mas deu certo!' : 'Foi por pouco! Tente de novo para ganhar mais estrelas.'}</p>
    ${last ? '<p><b>🎄 Você entregou todos os presentes da vila!</b> O céu já está clareando… agora é hora de <b>voltar ao Polo Norte sem ser visto</b>. Uma trilha se abriu à direita da vila.</p>' : ''}
    <p><b>Quer salvar seu progresso no MemoryCard?</b></p>
    <div class="row"><button class="primary" id="mSave" data-focus="1">💾 Salvar e continuar</button><button id="mNo">Continuar sem salvar</button></div>
    <div class="row" style="margin-top:8px;"><button id="mRetry">🔁 Jogar de novo</button></div>`);
  const go = () => { if(last){ closeModal(); playCutscene('amanhecer', () => fadeTo(() => { openWorld('night', { gate:true }); })); } else fadeTo(() => { closeModal(); openWorld('night', { fromHouse:i }); }); };
  $('mSave').onclick = () => { saveGame(G.phase); go(); };
  $('mNo').onclick = go;
  $('mRetry').onclick = () => startHouse(i);
}

/* --- desenho da casa --- */
const ROOM_FLOORS = [['#c79a62','#bd9058'],['#b48a58','#a98050']];
function buildHouseBg(){
  const h = H.h, CW = h.cols*TILE, CH = h.rows*TILE+MT;
  const c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.fillStyle = '#0b0e1f'; g.fillRect(0,0,CW,CH);
  const kidRoom = new Map(); H.kids.forEach(k => kidRoom.set(k.room, k.i));
  for(let y=0;y<h.rows;y++) for(let x=0;x<h.cols;x++){
    const t = h.tok[y][x], ox = x*TILE, oy = y*TILE+MT;
    if(t==='#'){
      g.fillStyle = '#4a3a5a'; g.fillRect(ox,oy,TILE,TILE);
      g.fillStyle = '#5a4870'; for(let i=0;i<TILE;i+=8) g.fillRect(ox+i,oy,4,TILE-6);
      g.fillStyle = '#6a5882'; g.fillRect(ox,oy,TILE,4);
      g.fillStyle = '#2e2440'; g.fillRect(ox,oy+TILE-6,TILE,6); g.fillStyle = '#8a6a48'; g.fillRect(ox,oy+TILE-6,TILE,2);
      continue;
    }
    const rid = h.room[y][x], ki = kidRoom.get(rid);
    const alt = (x+y)&1;
    if(t==='D'){ g.fillStyle = '#6a4a28'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#8a6234'; g.fillRect(ox+4,oy+4,TILE-8,TILE-8); continue; }
    if(ki!=null){ g.fillStyle = alt ? shade(KID_COL[ki],0.62) : shade(KID_COL[ki],0.7); g.fillRect(ox,oy,TILE,TILE); g.fillStyle = 'rgba(0,0,0,.05)'; g.fillRect(ox,oy+TILE-1,TILE,1); g.fillRect(ox+TILE-1,oy,1,TILE); }
    else { const p = ROOM_FLOORS[Math.max(0,rid)%2]; g.fillStyle = alt ? p[0] : p[1]; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(ox,oy+19,TILE,1); g.fillRect(ox,oy+TILE-1,TILE,1); g.fillRect(ox+((x*13)%30)+4,oy,1,19); g.fillRect(ox+((y*17)%30)+4,oy+20,1,19); }
    if(t==='o'){ g.fillStyle = '#6a4a28'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#8a6234'; g.fillRect(ox+2,oy+2,TILE-4,TILE-4); g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(ox,oy+19,TILE,2); }
  }
  H.creaks.forEach(cr => {
    const ox = cr.x*TILE, oy = cr.y*TILE+MT;
    g.fillStyle = '#e2bd86'; g.fillRect(ox+2,oy+2,TILE-4,TILE-4);
    g.fillStyle = '#c89c62'; g.fillRect(ox+2,oy+13,TILE-4,2); g.fillRect(ox+2,oy+26,TILE-4,2);
    g.fillStyle = '#5a3a1e'; g.fillRect(ox+6,oy+6,2,2); g.fillRect(ox+TILE-8,oy+6,2,2); g.fillRect(ox+6,oy+TILE-8,2,2); g.fillRect(ox+TILE-8,oy+TILE-8,2,2);
    g.fillStyle = '#3a2410'; g.fillRect(ox+14,oy+10,2,6); g.fillRect(ox+16,oy+15,2,6); g.fillRect(ox+14,oy+20,2,6); g.fillRect(ox+20,oy+22,6,2);
  });
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0,MT,CW,3);
  return c;
}
function drawBed(g, k){
  const cells = k.bed; if(!cells.length) return;
  const xs = cells.map(c => c.x), ys = cells.map(c => c.y);
  const x0 = Math.min(...xs)*TILE, y0 = Math.min(...ys)*TILE+MT, w = (Math.max(...xs)-Math.min(...xs)+1)*TILE, hh = (Math.max(...ys)-Math.min(...ys)+1)*TILE;
  const vert = hh > w;
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x0+3,y0+hh-3,w-4,5);
  g.fillStyle = '#7a4a22'; g.fillRect(x0+2,y0+2,w-4,hh-4);
  g.fillStyle = '#9a6430'; g.fillRect(x0+2,y0+2,w-4,3);
  g.fillStyle = '#f4f0e8'; g.fillRect(x0+5,y0+5,w-10,hh-10);
  // travesseiro na cabeceira e cobertor
  const head = k.head, hx = head.x*TILE, hy = head.y*TILE+MT;
  g.fillStyle = '#fff'; g.fillRect(hx+6, hy+6, 28, 18);
  g.fillStyle = '#d8d8e8'; g.fillRect(hx+6, hy+22, 28, 2);
  if(vert){ g.fillStyle = KID_COL[k.i]; g.fillRect(x0+5, y0+28, w-10, hh-33); g.fillStyle = shade(KID_COL[k.i],-0.25); g.fillRect(x0+5, y0+28, w-10, 3); }
  else { const dir = (head.x === Math.min(...xs)) ? 1 : -1; const bx = dir>0 ? x0+30 : x0+5; g.fillStyle = KID_COL[k.i]; g.fillRect(bx, y0+5, w-35, hh-10); }
  g.strokeStyle = '#0b0e1f'; g.lineWidth = 2; g.strokeRect(x0+2,y0+2,w-4,hh-4);
}
function drawKidHead(g, k, t){
  const hx = k.head.x*TILE+20, hy = k.head.y*TILE+MT+15;
  const hair = KID_HAIR[k.i], skin = '#f6c9a0';
  const up = k.state==='awake', wob = k.state==='stir' ? Math.sin(t*16)*1.5 : 0;
  g.fillStyle = '#0b0e1f'; g.fillRect(hx-9+wob, hy-9, 18, 17);
  g.fillStyle = skin; g.fillRect(hx-8+wob, hy-7, 16, 14);
  g.fillStyle = hair; g.fillRect(hx-8+wob, hy-8, 16, 6); g.fillRect(hx-8+wob, hy-8, 3, 11);
  if(k.i%2) { g.fillRect(hx+5+wob, hy-8, 3, 11); }
  if(k.state==='sleep'){ g.fillStyle = '#0b0e1f'; g.fillRect(hx-5+wob,hy,4,1); g.fillRect(hx+1+wob,hy,4,1); g.fillStyle = '#e88a8a'; g.fillRect(hx-6+wob,hy+3,3,2); g.fillRect(hx+3+wob,hy+3,3,2); }
  else { g.fillStyle = '#fff'; g.fillRect(hx-5+wob,hy-2,4,4); g.fillRect(hx+1+wob,hy-2,4,4); g.fillStyle = '#0b0e1f';
    const d = DV[k.look||k.face]; const ex = up ? d.x : 0, ey = up ? d.y : 0; g.fillRect(hx-4+ex+wob,hy-1+ey,2,2); g.fillRect(hx+2+ex+wob,hy-1+ey,2,2); g.fillRect(hx-2+wob,hy+4,4,1); }
  if(k.state==='sleep'){ // zzz

/* =========================================================================
   PARTE 3 — Caminho para o Polo Norte: 3 cidades grandes (a tela rola), de madrugada.
   Pessoas comuns andam pelas ruas com cone de visão. O sol vai nascendo: mais gente, mais rápida, vendo mais longe.
   Visto → volta ao começo da cidade anterior (o amanhecer reinicia ao entrar).
   ========================================================================= */
const NORTH_CITIES = [
  { name:'Vila dos Pinheiros', nbx:6, nby:3, seed:11, npc:[6,11],  dawn:170, range:4.5, react:1.5, speed:0.50, items:0.30,
    tip:'Uma cidade tranquila de madrugada. Poucas pessoas, andando devagar. Cada pessoa enxerga em um cone: fique fora dele ou esconda-se atrás de carros, lixeiras, árvores e bancos (Z).' },
  { name:'Cidade Grande', nbx:7, nby:3, seed:22, npc:[10,17],  dawn:180, range:5.5, react:1.2, speed:0.42, items:0.34,
    tip:'Mais gente na rua e mais becos. Os becos entre os prédios são atalhos escuros. Observe para onde cada pessoa vai olhar antes de atravessar.' },
  { name:'Cidade das Luzes', nbx:8, nby:4, seed:33, npc:[14,25], dawn:200, range:6.5, react:1.0, speed:0.36, items:0.36,
    tip:'A última antes do Polo Norte! Muita gente, e o dia já está quase chegando. Passe sem ser visto até o final da rua da direita.' }
];
const N = { idx:0, def:null, par:null, C:0, R:0, gnd:[], obj:[], blds:[], rowItems:[], bg:null, cam:{x:0,y:0}, vw:16, vh:10,
            player:null, npcs:[], t:0, dawn:0, peak:0, active:false, hidden:false, hideAt:null, padWas:false, fx:[], spawnT:0,
            end:null, endTimer:0, nextId:1, rings:[], moves:0 };
const NHIDE = 'TCKbS', NBLOCKLOS = 'BT';
const part2Done = () => DIFFS.some(d => (G.night.stars[d]||{})[9]);
const northStarsOf = i => (G.north.stars[diff()] || {})[i] || 0;
function northMult(){ return diff()==='facil' ? { react:1.3, npc:0.7, range:0.9, dawn:1.25 } : diff()==='dificil' ? { react:0.8, npc:1.5, range:1.1, dawn:0.85 } : { react:1, npc:1, range:1, dawn:1 }; }

/* --- geração da cidade --- */
function genCity(i){
  const def = NORTH_CITIES[i];
  for(let attempt=0; attempt<30; attempt++){
    const rnd = mulberry32((Math.random()*2147483647)|0);
    const C = 8*def.nbx+2, R = 6*def.nby+2;
    const gnd = Array.from({length:R}, (_,y) => Array.from({length:C}, (_,x) => ((x%8)<2 || (y%6)<2) ? 's' : 'k'));
    const obj = Array.from({length:R}, () => Array(C).fill(' '));
    const blds = [];
    const addB = (x,y,w,h) => { blds.push({ x,y,w,h, pal:NIGHT_PAL[(rnd()*5)|0], lit:[rnd()<0.4,rnd()<0.4,rnd()<0.4,rnd()<0.4,rnd()<0.4,rnd()<0.4], door:1+((rnd()*(Math.max(1,w-2)))|0), tall:rnd()<0.4 });
      for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++){ obj[yy][xx] = 'B'; gnd[yy][xx] = 'k'; } };
    for(let by=0; by<def.nby; by++) for(let bx=0; bx<def.nbx; bx++){
      const x0 = bx*8+2, y0 = by*6+2, r = rnd();
      if(r<0.62) addB(x0,y0,6,4);
      else if(r<0.80){ addB(x0,y0,3,4); addB(x0+4,y0,2,4); for(let yy=y0;yy<y0+4;yy++) gnd[yy][x0+3] = 'a'; }
      else if(r<0.92){                                                  // pracinha com árvores e bancos
        for(let yy=y0;yy<y0+4;yy++) for(let xx=x0;xx<x0+6;xx++) gnd[yy][xx] = 'g';
        const spots = [[x0+1,y0+1],[x0+4,y0+1],[x0+2,y0+2],[x0+5,y0+3],[x0,y0+3]], its = ['T','b','S','T','b'];
        spots.forEach((s,k) => { if(rnd()<0.8) obj[s[1]][s[0]] = its[k]; });
      } else {                                                          // praça com árvore de Natal
        for(let yy=y0;yy<y0+4;yy++) for(let xx=x0;xx<x0+6;xx++) gnd[yy][xx] = 'z';
        obj[y0+1][x0+2] = 'T'; obj[y0+1][x0+3] = 'T'; obj[y0+3][x0+1] = 'S'; obj[y0+3][x0+4] = 'S';
      }
    }
    // ruas interrompidas por construções e bosques: a rua precisa contornar, fazer curva e às vezes termina em beco
    const plug = (xa,ya,w,h) => {
      if(rnd()<0.62){ addB(xa,ya,w,h); return; }
      for(let yy=ya;yy<ya+h;yy++) for(let xx=xa;xx<xa+w;xx++){ gnd[yy][xx] = 'g'; obj[yy][xx] = rnd()<0.85 ? 'T' : 'b'; }
    };
    for(let by=0; by<=def.nby; by++) for(let bx=0; bx<def.nbx; bx++) if(rnd()<0.38) plug(bx*8+2, by*6, 6, 2);       // trechos horizontais
    for(let bx=0; bx<=def.nbx; bx++) for(let by=0; by<def.nby; by++) if(rnd()<0.38) plug(bx*8, by*6+2, 2, 4);       // trechos verticais
    const hrows = []; for(let by=0; by<=def.nby; by++) hrows.push(by*6+1);
    const ysE = hrows[(rnd()*hrows.length)|0];
    // itens nas ruas (sempre sobra uma faixa livre)
    for(let y=0;y<R;y++) for(let x=0;x<C;x++){
      if(obj[y][x]!==' ' || gnd[y][x]!=='s') continue;
      const vx = (x%8)<2, hy = (y%6)<2;
      if(vx && hy) continue;
      if(x<7 || x>C-8) continue;
      if(rnd() > def.items*0.5) continue;
      const mate = vx ? [x%2 ? x-1 : x+1, y] : [x, y%2 ? y-1 : y+1];
      if(obj[mate[1]] && obj[mate[1]][mate[0]]!==' ') continue;
      let near = false;
      for(let dd=-2; dd<=2; dd++){ const px = vx ? x : x+dd, py = vx ? y+dd : y; if(obj[py] && obj[py][px] && obj[py][px]!==' ' && obj[py][px]!=='B'){ near = true; break; } }
      if(near) continue;
      const pool = ['C','C','K','b','T','L','S']; obj[y][x] = pool[(rnd()*pool.length)|0];
    }
    // conectividade: entrada → todo o chão livre
    const entry = { x:1, y:ysE };
    const seen = new Set([entry.x+','+entry.y]), q = [entry];
    while(q.length){ const c = q.pop(); for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = c.x+d[0], ny = c.y+d[1], k = nx+','+ny; if(nx<0||ny<0||nx>=C||ny>=R||seen.has(k)||obj[ny][nx]!==' ') continue; seen.add(k); q.push({x:nx,y:ny}); } }
    if(obj[entry.y][entry.x]!==' ') continue;
    for(let y=0;y<R;y++) for(let x=0;x<C;x++) if(obj[y][x]===' ' && !seen.has(x+','+y)){ obj[y][x] = 'T'; gnd[y][x] = 'g'; }     // sem bolsões isolados: vira mato
    // distância da entrada até o lado direito: não pode dar para ir reto
    const dist = new Map([[entry.x+','+entry.y,0]]), qq = [entry]; let best = 1e9;
    for(let h=0; h<qq.length; h++){ const c = qq[h], dc = dist.get(c.x+','+c.y); if(c.x===C-1) best = Math.min(best, dc);
      for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = c.x+d[0], ny = c.y+d[1], k = nx+','+ny; if(nx<0||ny<0||nx>=C||ny>=R||dist.has(k)||obj[ny][nx]!==' ') continue; dist.set(k,dc+1); qq.push({x:nx,y:ny}); } }
    if(best>1e8) continue;
    if(best < (C-1)*1.35 && attempt<45) continue;
    let free = 0; for(let y=0;y<R;y++) for(let x=0;x<C;x++) if(obj[y][x]===' ') free++;
    if(free < C*R*0.2) continue;
    const rowItems = Array.from({length:R}, () => []);
    for(let y=0;y<R;y++) for(let x=0;x<C;x++) if('TCKbSL'.includes(obj[y][x])) rowItems[y].push({ x, y, ch:obj[y][x] });
    return { C, R, gnd, obj, blds, rowItems, entry };
  }
  throw new Error('cidade inviável');
}
function cityWalk(x,y){ return x>=0 && y>=0 && x<N.C && y<N.R && N.obj[y][x]===' '; }
function bfsFrom(sx,sy){
  const dist = new Int16Array(N.C*N.R).fill(-1), prev = new Int32Array(N.C*N.R).fill(-1), q = [sx+sy*N.C]; dist[q[0]] = 0;
  for(let h=0; h<q.length; h++){
    const c = q[h], cx = c%N.C, cy = (c/N.C)|0;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = cx+d[0], ny = cy+d[1]; if(!cityWalk(nx,ny)) continue; const k = nx+ny*N.C; if(dist[k]>=0) continue; dist[k] = dist[c]+1; prev[k] = c; q.push(k); }
  }
  return { dist, prev, q };
}

/* --- fundo estático --- */
function drawBuilding(g, b){
  const ox = b.x*TILE, oy = b.y*TILE, w = b.w*TILE, h = b.h*TILE, pal = b.pal;
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(ox+4,oy+h-2,w-4,6);
  // fachada (última fileira)
  g.fillStyle = pal.wall; g.fillRect(ox+2,oy+h-TILE,w-4,TILE-2);
  g.fillStyle = shade(pal.wall,-0.14); g.fillRect(ox+2,oy+h-8,w-4,6);
  for(let i=0;i<b.w;i++){
    const wx = ox+i*TILE+9, wy = oy+h-TILE+8, lit = b.lit[i%6];
    if(i===b.door){ g.fillStyle = '#0b0e1f'; g.fillRect(ox+i*TILE+9,oy+h-30,22,28); g.fillStyle = '#a8602c'; g.fillRect(ox+i*TILE+11,oy+h-28,18,26); g.fillStyle = '#7a4418'; g.fillRect(ox+i*TILE+14,oy+h-24,5,9); g.fillRect(ox+i*TILE+21,oy+h-24,5,9); g.fillStyle = '#ffd34d'; g.fillRect(ox+i*TILE+25,oy+h-14,2,2); }
    else { g.fillStyle = '#0b0e1f'; g.fillRect(wx-1,wy-1,22,18); g.fillStyle = lit ? '#ffd86a' : '#1a2440'; g.fillRect(wx,wy,20,16); g.fillStyle = pal.trim; g.fillRect(wx+9,wy,2,16); g.fillRect(wx,wy+7,20,2); }
  }
  g.strokeStyle = '#0b0e1f'; g.lineWidth = 2; g.strokeRect(ox+2,oy+h-TILE,w-4,TILE-2);
  // telhado (vista de cima, com neve)
  const rh = h-TILE;
  g.fillStyle = pal.roof; g.fillRect(ox,oy,w,rh+4);
  g.fillStyle = shade(pal.roof,-0.2); for(let yy=6; yy<rh+2; yy+=8) g.fillRect(ox,oy+yy,w,1);
  g.fillStyle = '#eef4ff'; g.fillRect(ox,oy,w,4); g.fillRect(ox,oy+rh,w,4);
  for(let xx=0; xx<w; xx+=10){ g.fillRect(ox+xx,oy+4,6,2+((xx/10|0)%2)*2); }
  g.fillStyle = '#e8f0ff'; g.fillRect(ox+8,oy+12,w*0.35,rh-18); g.globalAlpha = 0.5; g.fillRect(ox+w*0.5,oy+10,w*0.4,rh-14); g.globalAlpha = 1;
  g.fillStyle = '#7a4a3a'; g.fillRect(ox+w-26,oy+8,12,14); g.fillStyle = '#fff'; g.fillRect(ox+w-27,oy+6,14,3);
  g.strokeStyle = '#0b0e1f'; g.lineWidth = 2; g.strokeRect(ox+1,oy+1,w-2,rh+3);
}
function buildCityBg(){
  const C = N.C, R = N.R, c = document.createElement('canvas'); c.width = C*TILE; c.height = R*TILE;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const r = mulberry32(N.def.seed*5);
  for(let y=0;y<R;y++) for(let x=0;x<C;x++){
    const ox = x*TILE, oy = y*TILE, k = N.gnd[y][x];
    if(k==='s'){
      g.fillStyle = (x+y)&1 ? '#3a3f52' : '#383d50'; g.fillRect(ox,oy,TILE,TILE);
      if(r()<0.5){ g.fillStyle = '#dce8ff'; g.fillRect(ox+((r()*34)|0), oy+((r()*36)|0), 5, 2); }
      if((x%8)<2 && (y%6)>=2 && x%8===0){ g.fillStyle = '#4a5068'; g.fillRect(ox+TILE-2,oy,2,TILE); }
      if((y%6)<2 && (x%8)>=2 && y%6===0){ g.fillStyle = '#4a5068'; g.fillRect(ox,oy+TILE-2,TILE,2); }
      if((x%8)<2 && x%8===0 && (y%6)>=2 && y%2===0){ g.fillStyle = '#e6d27a'; g.fillRect(ox+TILE-2,oy+8,3,16); }
      if((y%6)<2 && y%6===0 && (x%8)>=2 && x%2===0){ g.fillStyle = '#e6d27a'; g.fillRect(ox+8,oy+TILE-2,16,3); }
    } else if(k==='g'){ g.fillStyle = (x+y)&1 ? '#e6eefc' : '#dce6f8'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#c4d2ec'; g.fillRect(ox+((r()*30)|0),oy+((r()*34)|0),4,2); }
    else if(k==='z'){ g.fillStyle = (x+y)&1 ? '#b9b3a6' : '#aea89b'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#d4cfc3'; g.fillRect(ox,oy,TILE,2); g.fillRect(ox,oy,2,TILE); }
    else if(k==='a'){ g.fillStyle = '#2c3040'; g.fillRect(ox,oy,TILE,TILE); g.fillStyle = '#3a3f52'; g.fillRect(ox+4,oy+4,8,8); g.fillRect(ox+24,oy+22,8,8); }
    else { g.fillStyle = '#d6e0f2'; g.fillRect(ox,oy,TILE,TILE); }
  }
  N.blds.forEach(b => drawBuilding(g,b));
  // saída à direita: portal de luz
  for(let y=0;y<R;y++){ if(N.obj[y][C-1]!==' ') continue; g.fillStyle = 'rgba(255,230,140,.22)'; g.fillRect((C-1)*TILE+6,y*TILE,TILE-6,TILE); }
  return c;
}

/* --- pessoas --- */
const personCache = new Map();
function personSprite(dir, frame, v){
  const k = dir+frame+'_'+v; let c = personCache.get(k);
  if(!c){ c = pixelsToCanvas(renderPersonPixels(dir, frame, v)); personCache.set(k,c); }
  return c;
}
function curRange(){ return N.par.range * northMult().range * (1 + 0.35*N.dawn); }
function curReact(){ return N.par.react * northMult().react * (1 - 0.25*N.dawn); }
function losN(x0,y0,x1,y1){
  let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0), sx = x0<x1?1:-1, sy = y0<y1?1:-1, err = dx-dy, x = x0, y = y0;
  for(let guard=0; guard<64; guard++){
    if(x===x1 && y===y1) return true;
    const e2 = 2*err; if(e2>-dy){ err -= dy; x += sx; } if(e2<dx){ err += dx; y += sy; }
    if(x===x1 && y===y1) return true;
    if(NBLOCKLOS.includes(N.obj[y][x])) return false;
  }
  return true;
}
function npcPos(n){ return n.t<0.5 ? { x:n.fromX, y:n.fromY } : { x:n.gx, y:n.gy }; }
function npcSees(n, tx, ty){
  const p = npcPos(n), dx = tx-p.x, dy = ty-p.y, d = Math.hypot(dx,dy);
  if(d>curRange()) return false;
  if(d===0) return true;
  if(d>1.5){ const f = DV[n.face]; if((dx*f.x+dy*f.y)/d < 0.68) return false; }
  return losN(p.x,p.y,tx,ty);
}
function spawnNpc(){
  const P = N.player, away = (x,y) => Math.abs(x-P.gx) > N.vw/2+3 || Math.abs(y-P.gy) > N.vh/2+3;
  for(let tries=0; tries<40; tries++){
    const x = (Math.random()*N.C)|0, y = (Math.random()*N.R)|0;
    if(!cityWalk(x,y) || !away(x,y) || Math.hypot(x-P.gx,y-P.gy) < 12) continue;
    const bf = bfsFrom(x,y), cand = [];
    for(let k=0;k<bf.dist.length;k++) if(bf.dist[k]>=14 && bf.dist[k]<=46) cand.push(k);
    if(!cand.length) continue;
    let t = cand[(Math.random()*cand.length)|0]; const path = [];
    while(t!==x+y*N.C && t>=0){ path.push({ x:t%N.C, y:(t/N.C)|0 }); t = bf.prev[t]; }
    path.reverse();
    N.npcs.push({ id:N.nextId++, gx:x, gy:y, fromX:x, fromY:y, t:1, face:'down', path, state:'walk', lookT:0, lookIdx:0, sinceLook:0, variant:(Math.random()*8)|0, alert:0, fade:0, dead:false, frame:0 });
    return;
  }
}
function npcStepTime(){ return N.par.speed * (1 - 0.3*N.dawn); }
function updateNpc(n, dt){
  if(n.dead){ n.fade += dt; return; }
  if(n.stand) return;
  n.sinceLook += dt;
  if(n.state==='look'){
    n.lookT -= dt;
    n.lookIdx = Math.floor((1.6-n.lookT)/0.45)%4;
    n.face = [n.base, CW_[n.base], n.base, CCW_[n.base]][Math.max(0, n.lookIdx)];
    if(n.lookT<=0){ n.state = 'walk'; n.face = n.base; }
    return;
  }
  if(n.t<1){ n.t += dt/npcStepTime(); if(n.t>=1){ n.t = 1; n.frame = 0; } else n.frame = Math.floor(n.t*2); }
  if(n.t>=1){
    if(!n.path.length){ n.dead = true; return; }
    if(n.sinceLook>3.5 && Math.random() < 0.002+0.004*N.dawn+dt*0.1){ n.state = 'look'; n.lookT = 1.6; n.base = n.face; n.sinceLook = 0; return; }
    const nx = n.path[0];
    if(N.player.gx===nx.x && N.player.gy===nx.y && !N.hidden) return;                 // espera o Papai Noel sair da frente
    n.path.shift(); n.fromX = n.gx; n.fromY = n.gy; n.gx = nx.x; n.gy = nx.y; n.t = 0;
    n.face = nx.x>n.fromX ? 'right' : nx.x<n.fromX ? 'left' : nx.y>n.fromY ? 'down' : 'up';
  }
}
function nearTarget(){ const m = northMult(), d = N.dawn; return Math.max(1, Math.round((lerp(N.par.npc[0], N.par.npc[1], d) + 1.5*Math.max(0,(N.t/dawnDur())-1)) * m.npc)); }
function dawnDur(){ return N.def.dawn * northMult().dawn; }

/* --- fluxo --- */
function startCity(i){ prepareCity(i); showCityIntro(); }
function prepareCity(i){
  closeModal(); MT = 16; N.idx = i;
  N.def = NORTH_CITIES[i]; N.par = N.def;
  const c = genCity(i);
  N.C = c.C; N.R = c.R; N.gnd = c.gnd; N.obj = c.obj; N.blds = c.blds; N.rowItems = c.rowItems;
  N.vw = 16; N.vh = 10; cv.width = N.vw*TILE; cv.height = N.vh*TILE + MT;
  N.player = { id:0, gx:c.entry.x, gy:c.entry.y, fromX:c.entry.x, fromY:c.entry.y, t:1, moving:false, dir:'right', stack:[], padDir:null, px:c.entry.x*TILE, py:c.entry.y*TILE };
  N.npcs = []; N.t = 0; N.dawn = 0; N.peak = 0; N.hidden = false; N.fx = []; N.rings = []; N.end = null; N.endTimer = 0; N.active = false; N.spawnT = 0.1; N.nextId = 1;
  N.bg = buildCityBg();
  N.cam.x = clamp(N.player.px+20-N.vw*TILE/2, 0, N.C*TILE-N.vw*TILE); N.cam.y = clamp(N.player.py+20-N.vh*TILE/2, 0, N.R*TILE-N.vh*TILE);
  setMode('north'); updateNorthHUD(true); setHint('', true); fit();

function beginCity(){ closeModal(); N.active = true; sfx('creak'); setHint(northHint(), true); }
function northHint(){ return 'Setas: andar • Z (ou A): esconder-se junto de carro, lixeira, árvore ou banco • Chegue ao lado direito do mapa →'; }
function updateNorthHUD(force){
  const set = (id, v) => { if(force || hud[id]!==v){ hud[id] = v; $(id).textContent = v; } };
  set('lblPhase', 'CIDADE '+(N.idx+1)+'/3 · '+N.def.name);
  set('lblTime', '🧭 '+Math.round(N.player.gx/(N.C-1)*100)+'%');
  const left = Math.max(0, dawnDur()-N.t);
  set('dn', left>0 ? fmtTime(left) : '☀');
  set('dnTxt', left>0 ? ' p/ o sol' : ' amanheceu!');
  $('gfill').style.width = (N.dawn*100)+'%';
  let m = 0; N.npcs.forEach(n => { m = Math.max(m, n.alert); });
  $('afill').style.width = Math.min(100,m*100)+'%'; $('afill').classList.toggle('hot', m>0.6);
}
function stealthHidden(){ return (Game.mode==='house' && H.hidden) || (Game.mode==='north' && N.hidden); }
function stealthUnhide(){ if(Game.mode==='house') H.hidden = false; else N.hidden = false; }

function updateNorth(dt){
  if(!N.player) return;
  N.rings.forEach(r => r.t += dt); N.rings = N.rings.filter(r => r.t<0.8);
  N.fx.forEach(f => { f.life -= dt; f.y -= 26*dt; }); N.fx = N.fx.filter(f => f.life>0);
  const p = N.player, tx = p.px+20-N.vw*TILE/2, ty = p.py+20-N.vh*TILE/2;
  N.cam.x = lerp(N.cam.x, clamp(tx,0,N.C*TILE-N.vw*TILE), Math.min(1,dt*7)); N.cam.y = lerp(N.cam.y, clamp(ty,0,N.R*TILE-N.vh*TILE), Math.min(1,dt*7));
  if(N.end){ N.endTimer -= dt; if(N.endTimer<=0 && N.end.pending){ N.end.pending = false; N.end.cb(); } return; }
  if(!N.active || G.paused || Game.fade) return;
  pollGamepad();
  N.t += dt; N.dawn = clamp(N.t/dawnDur(), 0, 1);
  if(N.hidden && p.padDir && !N.padWas) N.hidden = false;
  N.padWas = !!p.padDir;
  if(!N.hidden) updateWalker(p, dt, cityWalk);
  // pessoas: surgem, andam e somem
  N.spawnT -= dt;
  if(N.spawnT<=0){ N.spawnT = 0.5; if(N.npcs.filter(n => !n.dead).length < nearTarget()) spawnNpc(); }
  N.npcs.forEach(n => updateNpc(n, dt));
  N.npcs = N.npcs.filter(n => !(n.dead && n.fade>0.5) && !(Math.hypot(n.gx-p.gx,n.gy-p.gy)>48));
  // visão
  let maxA = 0, seer = null;
  N.npcs.forEach(n => {
    const pp = p.moving && p.t>0.5 ? { x:p.gx, y:p.gy } : { x:p.gx, y:p.gy };
    const seen = !n.dead && !N.hidden && npcSees(n, pp.x, pp.y), close = seen && Math.hypot(n.gx-p.gx, n.gy-p.gy) <= 1.6;
    if(seen){ const before = n.alert; n.alert = Math.min(1.001, n.alert + dt/curReact()*(close?2:1)); if(((n.alert*10)|0)!==((before*10)|0)) sfx('alert'); seer = n; }
    else n.alert = Math.max(0, n.alert - dt/(curReact()*0.7));
    maxA = Math.max(maxA, n.alert);
  });
  N.peak = Math.max(N.peak, maxA);
  if(maxA>=1){ caughtInCity(seer); return; }
  if(p.arrived){ p.arrived = false; if(p.gx===N.C-1){ finishCity(); return; } }
  updateNorthHUD(false);
}
function cityPressUse(p){
  if(!N.active || G.paused || p.moving) return;
  if(N.hidden){ N.hidden = false; return; }
  const d = DIRS[p.dir], fx = p.gx+d.x, fy = p.gy+d.y, ch = N.obj[fy] && N.obj[fy][fx];
  if(ch && NHIDE.includes(ch)){ N.hidden = true; N.hideAt = { x:fx, y:fy }; p.stack = []; N.padWas = !!p.padDir; sfx('hide'); N.fx.push({ x:p.px+20, y:p.py-4, txt:'shh...', col:'#cfe8ff', life:1, max:1 }); }
  else { sfx('deny'); N.fx.push({ x:p.px+20, y:p.py-4, txt:'nada para se esconder', col:'#ffb0b8', life:1, max:1 }); }
}

function drawCityItem(g, it, t){
  const ox = it.x*TILE-N.cam.x, oy = it.y*TILE-N.cam.y+MT, c = it.ch;
  if(c==='T'){ drawPineAt(g, ox, oy, t); return; }

function renderNorth(){

  g.drawImage(N.bg, cx, cy, vw, vh, 0, MT, vw, vh);
  const x0 = Math.floor(cx/TILE)-1, x1 = Math.ceil((cx+vw)/TILE)+1, y0 = Math.floor(cy/TILE)-1, y1 = Math.ceil((cy+vh)/TILE)+2;
  const p = N.player, prow = Math.round(p.py/TILE);
  for(let y=Math.max(0,y0); y<Math.min(N.R,y1); y++){
    N.rowItems[y].forEach(it => { if(it.x>=x0 && it.x<=x1) drawCityItem(g, it, N.t); });
    N.npcs.forEach(n => { if(Math.round(lerp(n.fromY,n.gy,n.t))===y) drawPerson(g,n); });
    if(prow===y) drawCitySanta(g);
  }
  // luz do amanhecer + cones de visão
  const sx = N.cam.x, sy = N.cam.y;
  if(!ndark || ndark.width!==vw || ndark.height!==vh+MT){ ndark = document.createElement('canvas'); ndark.width = vw; ndark.height = vh+MT; }
  const d = ndark.getContext('2d'); d.globalCompositeOperation = 'source-over'; d.clearRect(0,0,vw,vh+MT);
  const nightA = 0.58*(1-N.dawn)+0.04;
  d.fillStyle = 'rgba(6,8,34,'+nightA+')'; d.fillRect(0,MT,vw,vh);
  d.globalCompositeOperation = 'destination-out';
  const lit = [];
  N.npcs.forEach(n => {
    if(n.dead) return; const pp = npcPos(n), R = Math.ceil(curRange());
    for(let ty=pp.y-R; ty<=pp.y+R; ty++) for(let tx=pp.x-R; tx<=pp.x+R; tx++){
      if(tx<0||ty<0||tx>=N.C||ty>=N.R||N.obj[ty][tx]==='B') continue;
      const px = tx*TILE-sx, py = ty*TILE-sy+MT; if(px<-TILE||py<-TILE||px>vw||py>vh+MT) continue;
      if(npcSees(n,tx,ty)){ d.globalAlpha = 0.9; d.fillStyle = '#000'; d.fillRect(px,py,TILE,TILE); lit.push([px,py,n.alert]); }
    }
  });
  d.globalAlpha = 1; d.globalCompositeOperation = 'source-over';
  g.drawImage(ndark,0,0);
  lit.forEach(l => { g.fillStyle = l[2]>0.05 ? 'rgba(255,150,90,.26)' : 'rgba(255,224,120,.20)'; g.fillRect(l[0],l[1],TILE,TILE); });
  // lampiões e brilho do nascer do sol
  const lampA = 0.4*(1-N.dawn);
  if(lampA>0.02) for(let y=Math.max(0,y0); y<Math.min(N.R,y1); y++) N.rowItems[y].forEach(it => { if(it.ch==='L'){ const lx = it.x*TILE-sx+20, ly = it.y*TILE-sy+MT+8, gr = g.createRadialGradient(lx,ly,2,lx,ly,64); gr.addColorStop(0,'rgba(255,225,130,'+lampA+')'); gr.addColorStop(1,'rgba(255,225,130,0)'); g.fillStyle = gr; g.fillRect(lx-64,ly-64,128,128); } });
  if(N.dawn>0){ const gr = g.createLinearGradient(0,MT,0,MT+vh*0.7); gr.addColorStop(0,'rgba(255,140,90,'+(0.30*N.dawn)+')'); gr.addColorStop(1,'rgba(255,200,140,0)'); g.fillStyle = gr; g.fillRect(0,MT,vw,vh); }
  // alerta sobre o Papai Noel
  let m = 0; N.npcs.forEach(n => { m = Math.max(m, n.alert); });
  if(m>0.02 && !N.hidden){ const px = p.px-sx+20, py = p.py-sy+MT-6; g.fillStyle = '#0b0e1f'; g.fillRect(px-14,py-3,28,7); g.fillStyle = m>0.6 ? '#ff4a4a' : '#ffb84a'; g.fillRect(px-13,py-2,Math.round(26*Math.min(1,m)),5); }
  // seta da saída quando perto do fim

  if(exitX<vw+TILE){ g.fillStyle = '#ffe45c'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('➜', exitX+22+Math.sin(N.t*6)*3, MT+vh/2); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  N.fx.forEach(f => { g.globalAlpha = clamp(f.life/0.4,0,1); g.font = 'bold 13px monospace'; g.fillStyle = '#000'; g.fillText(f.txt, f.x-sx+1, f.y-sy+MT+1); g.fillStyle = f.col; g.fillText(f.txt, f.x-sx, f.y-sy+MT); g.globalAlpha = 1; });
  // barra de amanhecer no topo da tela (faixa de 16px)
  g.fillStyle = '#0b0e1f'; g.fillRect(0,0,vw,MT);
  g.fillStyle = '#1a2347'; g.fillRect(6,4,vw-12,8);

}

function playCutscene(name, done){
  const scenes = CUT_SCENES[name]; if(!scenes){ done && done(); return; }
  const layer = $('cutLayer'); CUT.active = true; G.paused = true;
  CUT.scenes = scenes; CUT.i = 0; CUT.t = 0; CUT.shown = 0; CUT.done = done; CUT.last = performance.now();
  layer.innerHTML = '<div id="cutBox"><canvas id="cutCv" width="'+CUW+'" height="'+CUH+'"></canvas><div id="cutText"></div><div id="cutHint">Enter / clique: continuar · Esc: pular</div></div>';
  layer.classList.add('show'); CUT.canvas = $('cutCv'); CUT.g = CUT.canvas.getContext('2d'); CUT.g.imageSmoothingEnabled = false;
  layer.onclick = () => cutNext();
  sfx('gate'); cutLoop();
}
function cutLoop(){
  if(!CUT.active) return;
  const now = performance.now(), dt = Math.min(0.05,(now-CUT.last)/1000); CUT.last = now; CUT.t += dt;
  const sc = CUT.scenes[CUT.i], g = CUT.g;
  sc.draw(g, CUT.t);
  const f = Math.max(0, 1-CUT.t/0.6); if(f>0){ g.fillStyle = 'rgba(0,0,0,'+f+')'; g.fillRect(0,0,CUW,CUH); }
  CUT.shown = Math.min(sc.text.length, CUT.shown + dt*45);
  $('cutText').textContent = sc.text.slice(0, CUT.shown|0);
  CUT.raf = requestAnimationFrame(cutLoop);
}
function cutNext(){
  if(!CUT.active) return;
  const sc = CUT.scenes[CUT.i];
  if(CUT.shown < sc.text.length){ CUT.shown = sc.text.length; return; }
  sfx('ui');
  if(CUT.i < CUT.scenes.length-1){ CUT.i++; CUT.t = 0; CUT.shown = 0; } else cutEnd();
}
function cutEnd(){
  if(!CUT.active) return;
  CUT.active = false; cancelAnimationFrame(CUT.raf);
  const layer = $('cutLayer'); layer.classList.remove('show'); layer.innerHTML = ''; layer.onclick = null;
  G.paused = false; const d = CUT.done; CUT.done = null; if(d) d();
}
function cutKey(e){
  e.preventDefault();
  if(e.code==='Escape') cutEnd();
  else if(e.code==='Enter' || e.code==='Space' || e.code==='KeyZ' || e.code==='KeyX') { if(!e.repeat) cutNext(); }
}
